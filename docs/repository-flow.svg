<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">Race Timer repository flow</title>
  <desc id="desc">Clean architecture flow for the Race Timer repository, from browser routing and role-based screens through local-first event synchronization, relay persistence, deterministic results, and offline recovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#263238"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity=".12"/>
    </filter>
    <style>
      .title { font: 800 38px Arial, sans-serif; fill: #17202a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #64748b; }
      .lane { font: 800 17px Arial, sans-serif; fill: #475569; letter-spacing: .12em; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #17202a; }
      .node-sub { font: 400 14px Arial, sans-serif; fill: #475569; }
      .tag { font: 700 12px Arial, sans-serif; fill: #64748b; letter-spacing: .08em; }
      .edge { font: 700 13px Arial, sans-serif; fill: #475569; }
      .guarantee { font: 700 16px Arial, sans-serif; fill: #ffffff; }
      .box { stroke-width: 2.2; filter: url(#shadow); }
      .flow { stroke: #263238; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .flow-muted { stroke: #64748b; stroke-width: 2.3; fill: none; marker-end: url(#arrow-muted); }
      .flow-dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="#edf0f2"/>
  <rect x="34" y="30" width="1732" height="1100" rx="28" fill="#fafafa" stroke="#d8dde2" stroke-width="2"/>

  <text x="86" y="88" class="title">Race Timer · repository flow</text>
  <text x="86" y="121" class="subtitle">One tap becomes a shared result — even when the network disappears.</text>

  <!-- Lane 1: entry and UI -->
  <rect x="70" y="165" width="1660" height="275" rx="24" fill="#f1f3f5" stroke="#d9dee3" stroke-width="2"/>
  <text x="105" y="204" class="lane">01 · ENTRY &amp; UI</text>

  <!-- connectors are behind nodes but within the lane -->
  <path d="M305 304 H375" class="flow"/>
  <path d="M605 304 H675" class="flow"/>
  <path d="M905 304 H975" class="flow"/>
  <path d="M1205 304 H1275" class="flow"/>
  <path d="M1505 304 H1575" class="flow"/>

  <rect x="115" y="260" width="190" height="88" rx="17" class="box" fill="#ffda3d" stroke="#b28a00"/>
  <text x="210" y="296" text-anchor="middle" class="node-title">Browser</text>
  <text x="210" y="322" text-anchor="middle" class="node-sub">open app URL</text>
  <text x="210" y="338" text-anchor="middle" class="tag">USER</text>

  <rect x="375" y="260" width="230" height="88" rx="17" class="box" fill="#bdb4f5" stroke="#776ac5"/>
  <text x="490" y="296" text-anchor="middle" class="node-title">src/main.tsx</text>
  <text x="490" y="322" text-anchor="middle" class="node-sub">createRoot(App)</text>
  <text x="490" y="338" text-anchor="middle" class="tag">BOOTSTRAP</text>

  <rect x="675" y="260" width="230" height="88" rx="17" class="box" fill="#bdb4f5" stroke="#776ac5"/>
  <text x="790" y="296" text-anchor="middle" class="node-title">src/ui.tsx</text>
  <text x="790" y="322" text-anchor="middle" class="node-sub">useRoute() + storage</text>
  <text x="790" y="338" text-anchor="middle" class="tag">ROUTING</text>

  <rect x="975" y="260" width="230" height="88" rx="17" class="box" fill="#bdb4f5" stroke="#776ac5"/>
  <text x="1090" y="296" text-anchor="middle" class="node-title">src/Home.tsx</text>
  <text x="1090" y="322" text-anchor="middle" class="node-sub">create or join room</text>
  <text x="1090" y="338" text-anchor="middle" class="tag">ROOM CODE</text>

  <rect x="1275" y="260" width="230" height="88" rx="17" class="box" fill="#bdb4f5" stroke="#776ac5"/>
  <text x="1390" y="296" text-anchor="middle" class="node-title">src/RoomView.tsx</text>
  <text x="1390" y="322" text-anchor="middle" class="node-sub">room shell + tabs</text>
  <text x="1390" y="338" text-anchor="middle" class="tag">ROOM VIEW</text>

  <rect x="1575" y="260" width="115" height="88" rx="17" class="box" fill="#a9d4ff" stroke="#659bd4"/>
  <text x="1632" y="296" text-anchor="middle" class="node-title">Role</text>
  <text x="1632" y="322" text-anchor="middle" class="node-sub">3 tabs</text>
  <text x="1632" y="338" text-anchor="middle" class="tag">SELECT</text>

  <!-- Lane 2: role actions -->
  <rect x="70" y="475" width="1660" height="225" rx="24" fill="#f1f3f5" stroke="#d9dee3" stroke-width="2"/>
  <text x="105" y="514" class="lane">02 · ROLE ACTIONS → EVENTS</text>

  <path d="M275 602 H350" class="flow"/>
  <path d="M755 602 H830" class="flow"/>
  <path d="M1235 602 H1310" class="flow"/>

  <rect x="105" y="555" width="170" height="94" rx="17" class="box" fill="#ffd9df" stroke="#d78c9a"/>
  <text x="190" y="591" text-anchor="middle" class="node-title">Start</text>
  <text x="190" y="617" text-anchor="middle" class="node-sub">release runners</text>
  <text x="190" y="637" text-anchor="middle" class="tag">StartTab.tsx</text>

  <rect x="350" y="555" width="405" height="94" rx="17" class="box" fill="#c9f0f2" stroke="#6ebcc0"/>
  <text x="552" y="591" text-anchor="middle" class="node-title">start event</text>
  <text x="552" y="617" text-anchor="middle" class="node-sub">runner names + tap timestamp</text>
  <text x="552" y="637" text-anchor="middle" class="tag">IMMUTABLE EVENT</text>

  <rect x="830" y="555" width="405" height="94" rx="17" class="box" fill="#c9f0f2" stroke="#6ebcc0"/>
  <text x="1032" y="591" text-anchor="middle" class="node-title">stop / cancel / void</text>
  <text x="1032" y="617" text-anchor="middle" class="node-sub">finish taps and corrections</text>
  <text x="1032" y="637" text-anchor="middle" class="tag">IMMUTABLE EVENTS</text>

  <rect x="1310" y="555" width="380" height="94" rx="17" class="box" fill="#b9d9ff" stroke="#6d9fd3"/>
  <text x="1500" y="591" text-anchor="middle" class="node-title">src/room.ts</text>
  <text x="1500" y="617" text-anchor="middle" class="node-sub">Room client receives every event</text>
  <text x="1500" y="637" text-anchor="middle" class="tag">SYNC CLIENT</text>

  <!-- Lane 3: data flow -->
  <rect x="70" y="735" width="1660" height="225" rx="24" fill="#f1f3f5" stroke="#d9dee3" stroke-width="2"/>
  <text x="105" y="774" class="lane">03 · LOCAL-FIRST DATA FLOW</text>

  <path d="M295 858 H380" class="flow"/>
  <path d="M650 858 H735" class="flow"/>
  <path d="M1005 858 H1090" class="flow"/>
  <path d="M1360 858 H1445" class="flow"/>

  <rect x="105" y="811" width="190" height="94" rx="17" class="box" fill="#c9f0f2" stroke="#6ebcc0"/>
  <text x="200" y="847" text-anchor="middle" class="node-title">Save first</text>
  <text x="200" y="873" text-anchor="middle" class="node-sub">localStorage</text>
  <text x="200" y="893" text-anchor="middle" class="tag">NO TAP LOST</text>

  <rect x="380" y="811" width="270" height="94" rx="17" class="box" fill="#b9d9ff" stroke="#6d9fd3"/>
  <text x="515" y="847" text-anchor="middle" class="node-title">pending queue</text>
  <text x="515" y="873" text-anchor="middle" class="node-sub">send missing events</text>
  <text x="515" y="893" text-anchor="middle" class="tag">ROOM CLIENT</text>

  <rect x="735" y="811" width="270" height="94" rx="17" class="box" fill="#bdb4f5" stroke="#776ac5"/>
  <text x="870" y="847" text-anchor="middle" class="node-title">server.js</text>
  <text x="870" y="873" text-anchor="middle" class="node-sub">validate via WebSocket</text>
  <text x="870" y="893" text-anchor="middle" class="tag">RELAY</text>

  <rect x="1090" y="811" width="270" height="94" rx="17" class="box" fill="#ffda3d" stroke="#b28a00"/>
  <text x="1225" y="847" text-anchor="middle" class="node-title">data/&lt;code&gt;.jsonl</text>
  <text x="1225" y="873" text-anchor="middle" class="node-sub">append-only persistence</text>
  <text x="1225" y="893" text-anchor="middle" class="tag">RELAY DISK</text>

  <rect x="1445" y="811" width="245" height="94" rx="17" class="box" fill="#f4c7f4" stroke="#c27fc2"/>
  <text x="1567" y="847" text-anchor="middle" class="node-title">broadcast</text>
  <text x="1567" y="873" text-anchor="middle" class="node-sub">all room devices</text>
  <text x="1567" y="893" text-anchor="middle" class="tag">REAL TIME</text>

  <!-- return path -->
  <path d="M1567 811 V785 H515 V811" class="flow-muted flow-dashed"/>
  <text x="1040" y="778" text-anchor="middle" class="edge">echo + merge missing events</text>

  <!-- output and recovery -->
  <rect x="70" y="995" width="1660" height="105" rx="24" fill="#17202a"/>
  <text x="105" y="1031" class="lane" style="fill:#cbd5e1">04 · DERIVE &amp; RECOVER</text>

  <path d="M350 1060 H475" class="flow-muted"/>
  <path d="M825 1060 H950" class="flow-muted"/>
  <path d="M1300 1060 H1425" class="flow-muted"/>

  <rect x="105" y="1040" width="245" height="42" rx="14" fill="#aaa0f3" stroke="#d1c9ff" stroke-width="2"/>
  <text x="227" y="1067" text-anchor="middle" class="node-title">src/race.ts · fold()</text>

  <rect x="475" y="1040" width="350" height="42" rx="14" fill="#a9d4ff" stroke="#d3e9ff" stroke-width="2"/>
  <text x="650" y="1067" text-anchor="middle" class="node-title">same events → same race state</text>

  <rect x="950" y="1040" width="350" height="42" rx="14" fill="#ffd9df" stroke="#ffe6ea" stroke-width="2"/>
  <text x="1125" y="1067" text-anchor="middle" class="node-title">offline → reconnect → resync</text>

  <rect x="1425" y="1040" width="265" height="42" rx="14" fill="#ffda3d" stroke="#fff0a6" stroke-width="2"/>
  <text x="1557" y="1067" text-anchor="middle" class="node-title">live results + CSV</text>

  <!-- structural links to lower lane -->
  <path d="M1567 905 V1040" class="flow-muted"/>
  <path d="M870 905 V1040 H227" class="flow-muted flow-dashed"/>
  <text x="705" y="1006" class="edge">all clients fold the shared event set</text>
</svg>
