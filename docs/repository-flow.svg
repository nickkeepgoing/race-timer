<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Race Timer repository flow</title>
  <desc id="desc">Flow from browser entry through role-based React screens, local-first event storage, WebSocket relay, deterministic race folding, offline recovery, and CSV export.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .title { font: 800 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #4b5563; }
      .section { font: 800 21px Arial, sans-serif; fill: #111827; }
      .node-title { font: 700 17px Arial, sans-serif; fill: #111827; }
      .node-text { font: 400 14px Arial, sans-serif; fill: #374151; }
      .small { font: 400 13px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 13px Arial, sans-serif; fill: #374151; }
      .node { stroke-width: 2; rx: 14; filter: url(#shadow); }
      .arrow { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="#f8fafc"/>
  <rect x="28" y="28" width="1544" height="1124" rx="24" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <text x="72" y="82" class="title">Race Timer repository flow</text>
  <text x="72" y="113" class="subtitle">Local-first race timing with immutable events, real-time WebSocket sync, and deterministic results.</text>

  <text x="72" y="165" class="section">1. Browser and role flow</text>

  <rect x="72" y="190" width="190" height="78" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="167" y="222" text-anchor="middle" class="node-title">Browser</text>
  <text x="167" y="246" text-anchor="middle" class="node-text">Open app URL</text>

  <rect x="315" y="190" width="220" height="78" class="node" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="425" y="222" text-anchor="middle" class="node-title">src/main.tsx</text>
  <text x="425" y="246" text-anchor="middle" class="node-text">createRoot(App)</text>

  <rect x="588" y="190" width="220" height="78" class="node" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="698" y="222" text-anchor="middle" class="node-title">src/ui.tsx</text>
  <text x="698" y="246" text-anchor="middle" class="node-text">useRoute() / hash route</text>

  <rect x="861" y="190" width="245" height="78" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="983" y="222" text-anchor="middle" class="node-title">src/Home.tsx</text>
  <text x="983" y="246" text-anchor="middle" class="node-text">Create or join room</text>

  <rect x="1159" y="190" width="245" height="78" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1281" y="222" text-anchor="middle" class="node-title">src/RoomView.tsx</text>
  <text x="1281" y="246" text-anchor="middle" class="node-text">Room shell + tabs</text>

  <path d="M262 229 H315" class="arrow"/>
  <path d="M535 229 H588" class="arrow"/>
  <path d="M808 229 H861" class="arrow"/>
  <path d="M1106 229 H1159" class="arrow"/>

  <rect x="250" y="325" width="300" height="105" class="node" fill="#fff7ed" stroke="#ea580c"/>
  <text x="400" y="360" text-anchor="middle" class="node-title">src/StartTab.tsx</text>
  <text x="400" y="384" text-anchor="middle" class="node-text">Enter runners</text>
  <text x="400" y="405" text-anchor="middle" class="node-text">start / cancel / undo</text>

  <rect x="650" y="325" width="300" height="105" class="node" fill="#fef2f2" stroke="#dc2626"/>
  <text x="800" y="360" text-anchor="middle" class="node-title">src/FinishTab.tsx</text>
  <text x="800" y="384" text-anchor="middle" class="node-text">Tap finishers</text>
  <text x="800" y="405" text-anchor="middle" class="node-text">stop / undo mis-taps</text>

  <rect x="1050" y="325" width="300" height="105" class="node" fill="#fefce8" stroke="#ca8a04"/>
  <text x="1200" y="360" text-anchor="middle" class="node-title">src/ResultsTab.tsx</text>
  <text x="1200" y="384" text-anchor="middle" class="node-text">Rank and correct results</text>
  <text x="1200" y="405" text-anchor="middle" class="node-text">download CSV</text>

  <path d="M1281 268 V300 H400 V325" class="arrow"/>
  <path d="M1281 268 V325" class="arrow"/>
  <path d="M1281 268 V300 H1200 V325" class="arrow"/>

  <text x="72" y="488" class="section">2. Local-first event and relay flow</text>

  <rect x="90" y="520" width="280" height="110" class="node" fill="#ffedd5" stroke="#f97316"/>
  <text x="230" y="555" text-anchor="middle" class="node-title">src/room.ts</text>
  <text x="230" y="579" text-anchor="middle" class="node-text">Room client</text>
  <text x="230" y="601" text-anchor="middle" class="node-text">clock sync + reconnect</text>

  <rect x="475" y="520" width="280" height="110" class="node" fill="#ecfeff" stroke="#0891b2"/>
  <text x="615" y="555" text-anchor="middle" class="node-title">localStorage</text>
  <text x="615" y="579" text-anchor="middle" class="node-text">rt:room:&lt;code&gt;</text>
  <text x="615" y="601" text-anchor="middle" class="node-text">events + pending queue</text>

  <rect x="860" y="520" width="300" height="110" class="node" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1010" y="555" text-anchor="middle" class="node-title">server.js</text>
  <text x="1010" y="579" text-anchor="middle" class="node-text">HTTP static host</text>
  <text x="1010" y="601" text-anchor="middle" class="node-text">WebSocket relay</text>

  <rect x="1265" y="520" width="250" height="110" class="node" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="1390" y="555" text-anchor="middle" class="node-title">data/&lt;code&gt;.jsonl</text>
  <text x="1390" y="579" text-anchor="middle" class="node-text">Append-only persistence</text>
  <text x="1390" y="601" text-anchor="middle" class="node-text">per race room</text>

  <path d="M370 575 H475" class="arrow"/>
  <text x="422" y="562" text-anchor="middle" class="label">save first</text>
  <path d="M755 575 H860" class="arrow"/>
  <text x="808" y="562" text-anchor="middle" class="label">WebSocket /ws</text>
  <path d="M1160 575 H1265" class="arrow"/>
  <text x="1212" y="562" text-anchor="middle" class="label">validate + append</text>

  <rect x="270" y="685" width="1060" height="90" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="800" y="720" text-anchor="middle" class="node-title">Immutable events</text>
  <text x="800" y="746" text-anchor="middle" class="node-text">start · stop · cancel · void — every device merges missing events without overwriting its own taps</text>

  <path d="M1010 630 V685" class="arrow"/>
  <path d="M615 630 V665 H800 V685" class="arrow"/>

  <text x="72" y="835" class="section">3. Deterministic state and resilience</text>

  <rect x="110" y="870" width="315" height="105" class="node" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="267" y="905" text-anchor="middle" class="node-title">src/race.ts</text>
  <text x="267" y="929" text-anchor="middle" class="node-text">fold(events)</text>
  <text x="267" y="951" text-anchor="middle" class="node-text">same event set = same result</text>

  <rect x="530" y="870" width="315" height="105" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="687" y="905" text-anchor="middle" class="node-title">Derived race state</text>
  <text x="687" y="929" text-anchor="middle" class="node-text">heats, runners, times</text>
  <text x="687" y="951" text-anchor="middle" class="node-text">live on every device</text>

  <rect x="950" y="870" width="430" height="105" class="node" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1165" y="905" text-anchor="middle" class="node-title">Offline / recovery loop</text>
  <text x="1165" y="929" text-anchor="middle" class="node-text">queue locally → reconnect with backoff</text>
  <text x="1165" y="951" text-anchor="middle" class="node-text">exchange missing events → rebuild relay</text>

  <path d="M800 775 V825 H267 V870" class="arrow"/>
  <path d="M425 922 H530" class="arrow"/>
  <path d="M845 922 H950" class="arrow dash"/>
  <text x="895" y="910" text-anchor="middle" class="small">network loss or restart</text>

  <rect x="110" y="1025" width="1270" height="78" rx="16" fill="#111827"/>
  <text x="745" y="1057" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:#ffffff">Core guarantee</text>
  <text x="745" y="1082" text-anchor="middle" style="font:400 15px Arial,sans-serif;fill:#d1d5db">A tap is saved locally before network I/O, and all clients converge when they hold the same immutable event set.</text>
</svg>
